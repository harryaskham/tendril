[package]
name = "tendril"
description = "Stateless desktop inspection and control CLI for agents."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["agent", "automation", "cli", "desktop", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "tendril"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ashpd.workspace = true
base64.workspace = true
clap.workspace = true
image.workspace = true
mcp-cli = { path = "../mcp-cli" }
pollster.workspace = true
tendril-win32 = { path = "../tendril-win32" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x11rb = { version = "0.13.2", features = ["image", "randr", "xtest"] }

[dev-dependencies]
proptest = "1.6.0"
tempfile = "3.15.0"

[lints]
workspace = true
