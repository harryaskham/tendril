[package]
name = "tendril"
description = "Stateless desktop inspection and control CLI for agents."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["agent", "automation", "cli", "desktop", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "tendril"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
image.workspace = true
mcp-cli = { git = "https://github.com/harryaskham/mcp-cli", branch = "main" }
feedback-cli.workspace = true
pollster.workspace = true
tendril-win32 = { path = "../tendril-win32" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile = "3.15.0"

# The reusable staged-update/MCP helper is intentionally Unix-only. Tendril's
# own `tendril update` implementation remains available on Windows; only the
# Unix staged-promotion helper and generic self_update_* MCP tools are omitted.
[target.'cfg(not(target_os = "windows"))'.dependencies]
updatable-cli.workspace = true

# AT-SPI (zbus), xdg-desktop-portal (ashpd), and X11 (x11rb) are Linux-only
# desktop integrations. Gate them to the linux target so they are not compiled
# on Windows/macOS, where zbus/ashpd fail to build (broken windows-sys path) or
# are simply unused (macOS uses AppKit/Quartz, not AT-SPI/portal/X11). bd-287b35.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
zbus.workspace = true
x11rb = { version = "0.13.2", features = ["image", "randr", "xtest"] }

[dev-dependencies]
proptest = "1.6.0"

[lints]
workspace = true
