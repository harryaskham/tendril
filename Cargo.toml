[package]
name = "tendril"
description = "Stateless desktop inspection and control CLI for agents."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["agent", "automation", "cli", "desktop", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [
  "crates/mcp-cli",
  "crates/tendril-win32",
]
resolver = "2"

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Stateless Rust CLI for agent-driven desktop inspection and control"
readme = "README.md"
repository = "https://github.com/harryaskham/tendril"
homepage = "https://github.com/harryaskham/tendril"
documentation = "https://github.com/harryaskham/tendril/blob/main/README.md"

[lib]
path = "crates/tendril/src/lib.rs"

[[bin]]
name = "tendril"
path = "crates/tendril/src/main.rs"

[[test]]
name = "integration_flows"
path = "crates/tendril/tests/integration_flows.rs"

[[test]]
name = "mcp_external_smoke"
path = "crates/tendril/tests/mcp_external_smoke.rs"

[[test]]
name = "mcp_parity"
path = "crates/tendril/tests/mcp_parity.rs"

[[test]]
name = "platform_contract"
path = "crates/tendril/tests/platform_contract.rs"

[[test]]
name = "runtime_dependency_audit"
path = "crates/tendril/tests/runtime_dependency_audit.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
image.workspace = true
mcp-cli = { git = "https://github.com/harryaskham/mcp-cli", branch = "main" }
feedback-cli.workspace = true
pollster.workspace = true
tendril-win32 = { path = "crates/tendril-win32" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile = "3.15.0"

# The reusable staged-update/MCP helper is intentionally Unix-only. Tendril's
# update command reports an explicit unsupported-capability error on Windows;
# Unix release assets follow updatable-cli's TendrilStyle contract.
[target.'cfg(not(target_os = "windows"))'.dependencies]
updatable-cli.workspace = true

# AT-SPI (zbus), xdg-desktop-portal (ashpd), and X11 (x11rb) are Linux-only
# desktop integrations. Gate them to Linux so macOS/Windows builds do not pull
# in unused Unix desktop stacks.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
zbus.workspace = true
x11rb = { version = "0.13.2", features = ["image", "randr", "xtest"] }

[dev-dependencies]
proptest = "1.6.0"

[workspace.dependencies]
anyhow = "1.0.98"
ashpd = "0.8.1"
base64 = "0.22.1"
clap = { version = "4.5.37", features = ["derive"] }
image = "0.25.6"
pollster = "0.4.0"
windows-sys = "0.61.2"
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
time = { version = "0.3.39", features = ["formatting"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
updatable-cli = { git = "https://github.com/harryaskham/updatable-cli", branch = "main" }
feedback-cli = { git = "https://github.com/harryaskham/feedback-cli", branch = "main" }
zbus = "4.4.0"

[workspace.metadata.crane]
name = "tendril-workspace"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

[lints]
workspace = true
