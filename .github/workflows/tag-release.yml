name: tag-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Run local pre-merge validation gate
        run: ./scripts/pre-merge.sh

      - name: Build tagged release artifacts
        run: ./scripts/release-artifacts.sh "$GITHUB_REF_NAME"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/release-manifest.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Extract release notes from changelog
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/release-manifest.json
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
