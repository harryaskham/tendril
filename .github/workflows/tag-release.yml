name: tag-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged release
    runs-on: [self-hosted, linux]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        run: rm -rf target dist

      - name: Verify Nix is available on the self-hosted runner
        run: nix --version

      - name: Run local pre-merge validation gate
        run: ./scripts/pre-merge.sh

  build-linux:
    name: Build linux release artifacts
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        run: rm -rf target dist

      - name: Verify Nix is available on the self-hosted runner
        run: nix --version

      - name: Build linux release artifacts
        run: ./scripts/release-artifacts.sh "$GITHUB_REF_NAME"

      - name: Upload linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS release artifacts
    runs-on: [self-hosted, macos]
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        run: rm -rf target dist

      - name: Verify Nix is available on the self-hosted runner
        run: nix --version

      - name: Build macOS release artifacts
        env:
          TENDRIL_RELEASE_DIST: ${{ github.workspace }}/dist/macos
        run: ./scripts/stage-release-artifacts.sh "$GITHUB_REF_NAME"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-macos
          path: |
            dist/macos/*.tar.gz
            dist/macos/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    needs:
      - build-linux
      - build-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        run: rm -rf target dist

      - name: Download linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-linux
          path: dist

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-macos
          path: dist

      - name: Flatten downloaded artifact directories
        run: |
          find dist -mindepth 2 -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;

      - name: Extract release notes from changelog
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/release-notes.md

      - name: Write combined release manifest
        run: ./scripts/write-release-manifest.py "$GITHUB_REF_NAME" dist > dist/release-manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/release-manifest.json
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
