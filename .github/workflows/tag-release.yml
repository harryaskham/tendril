name: tag-release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mcp-cli/Cargo.toml
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged or version-bump release
    runs-on: [self-hosted, azure-ephemeral]
    timeout-minutes: 60
    outputs:
      should_release: ${{ steps.release-context.outputs.should_release }}
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      release_version: ${{ steps.release-context.outputs.release_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        run: rm -rf target dist

      - name: Resolve release context
        id: release-context
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(./scripts/release-lib.sh version)"
          current_tag="v${current_version}"
          should_release=false

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ./scripts/release-lib.sh tag | grep -Fx "${GITHUB_REF_NAME}"
            current_tag="${GITHUB_REF_NAME}"
            should_release=true
          else
            previous_version=""
            if [[ -n "${{ github.event.before }}" ]] && git cat-file -e "${{ github.event.before }}:Cargo.toml" 2>/dev/null; then
              previous_version="$({ git show "${{ github.event.before }}:Cargo.toml" || true; } | sed -n '/^\[workspace.package\]/,/^\[/{ s/^version = "\([^"]*\)"$/\1/p; }' | head -n 1)"
            fi

            if [[ -z "${previous_version}" || "${previous_version}" != "${current_version}" ]]; then
              if git rev-parse -q --verify "refs/tags/${current_tag}" >/dev/null; then
                echo "Workspace version changed to ${current_version}, but ${current_tag} already exists; skipping duplicate release."
              else
                should_release=true
              fi
            else
              echo "Cargo metadata changed without a workspace version bump (${current_version}); skipping release."
            fi
          fi

          {
            echo "should_release=${should_release}"
            echo "release_tag=${current_tag}"
            echo "release_version=${current_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify Nix is available on the self-hosted runner
        if: steps.release-context.outputs.should_release == 'true'
        run: nix --version

      - name: Run local pre-merge validation gate
        if: steps.release-context.outputs.should_release == 'true'
        run: ./scripts/pre-merge.sh

  build-linux:
    name: Build linux release artifacts
    runs-on: [self-hosted, azure-ephemeral]
    timeout-minutes: 30
    needs: verify
    if: needs.verify.outputs.should_release == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        run: rm -rf target dist

      - name: Verify Nix is available on the self-hosted runner
        run: nix --version

      - name: Build linux release artifacts
        run: ./scripts/release-artifacts.sh "${{ needs.verify.outputs.release_tag }}"

      - name: Upload linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS release artifacts
    runs-on: [self-hosted, macos]
    timeout-minutes: 30
    needs: verify
    if: needs.verify.outputs.should_release == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        run: rm -rf target dist

      - name: Verify Nix is available on the self-hosted runner
        run: nix --version

      - name: Build macOS release artifacts
        env:
          TENDRIL_RELEASE_DIST: ${{ github.workspace }}/dist/macos
        run: ./scripts/stage-release-artifacts.sh "${{ needs.verify.outputs.release_tag }}"

      - name: Smoke packaged Tendril list flow on macOS
        env:
          TENDRIL_RELEASE_DIST: ${{ github.workspace }}/dist/macos
        run: ./scripts/macos-packaged-smoke.sh "${{ needs.verify.outputs.release_tag }}"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-macos
          path: |
            dist/macos/*.tar.gz
            dist/macos/*.sha256
          if-no-files-found: error

  build-windows:
    name: Build Windows release artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    needs: verify
    if: needs.verify.outputs.should_release == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        shell: pwsh
        run: Remove-Item -Recurse -Force target, dist -ErrorAction SilentlyContinue

      - name: Verify Rust is available on the hosted runner
        shell: pwsh
        run: |
          rustup show
          cargo --version

      - name: Build Windows Tendril binary
        shell: pwsh
        run: cargo build --release -p tendril

      - name: Stage Windows release artifact
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.release_version }}"
          $target = "x86_64-windows"
          $root = "tendril-$version-$target"
          New-Item -ItemType Directory -Force -Path "stage/$root", "dist/windows" | Out-Null
          Copy-Item "target/release/tendril.exe" "stage/$root/tendril.exe"
          tar -czf "dist/windows/$root.tar.gz" -C stage $root
          $hash = (Get-FileHash -Algorithm SHA256 "dist/windows/$root.tar.gz").Hash.ToLowerInvariant()
          "$hash  $root.tar.gz" | Set-Content -NoNewline "dist/windows/$root.sha256"

      - name: Smoke packaged Tendril version flow on Windows
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.release_version }}"
          $target = "x86_64-windows"
          $root = "tendril-$version-$target"
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          tar -xzf "dist/windows/$root.tar.gz" -C smoke
          & "smoke/$root/tendril.exe" --version

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows
          path: |
            dist/windows/*.tar.gz
            dist/windows/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: [self-hosted, azure-ephemeral]
    timeout-minutes: 30
    needs:
      - verify
      - build-linux
      - build-macos
      - build-windows
    if: needs.verify.outputs.should_release == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale local build artifacts
        run: rm -rf target dist

      - name: Download linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-linux
          path: dist

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-macos
          path: dist

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-windows
          path: dist

      - name: Flatten downloaded artifact directories
        run: |
          find dist -mindepth 2 -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;

      - name: Extract release notes from changelog
        run: ./scripts/release-notes.sh "${{ needs.verify.outputs.release_tag }}" > dist/release-notes.md

      - name: Write combined release manifest
        run: ./scripts/write-release-manifest.py "${{ needs.verify.outputs.release_tag }}" dist > dist/release-manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: dist/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/release-manifest.json
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.verify.outputs.release_tag, '-') }}
