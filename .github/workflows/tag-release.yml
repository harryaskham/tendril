name: tag-release

# Release assets are intentionally built from raw Cargo binaries inside the
# repository dev shell. Do not package `nix build .#tendril` here: that output
# is wrapped for Nix runtime dependencies (`.tendril-wrapped`) and is not a
# portable self-update payload. The archive layout below is the exact
# updatable-cli AssetStrategy::TendrilStyle contract.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release context
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: context
        name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag $tag is not a stable semver tag like v0.0.4" >&2
            exit 1
          fi
          version="${tag#v}"
          manifest_version="$(sed -n '/^\[workspace.package\]/,/^\[/{ s/^version = "\([^"]*\)"$/\1/p; }' Cargo.toml | head -n 1)"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "::error::tag $tag does not match Cargo workspace version $manifest_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test release source
    needs: resolve
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive
      - name: Run workspace tests inside the dev shell
        shell: bash
        run: nix develop --command cargo test --workspace --all-features --locked
      - name: Verify cargo install from repository root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tendril-cargo-install"
          rm -rf "$root"
          nix develop --command cargo install --locked --path . --root "$root"
          "$root/bin/tendril" version | grep -Fx "tendril ${{ needs.resolve.outputs.version }}"

  prepare-release:
    name: Prepare draft release
    needs: [resolve, test]
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 10
    steps:
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "$tag" \
              --generate-notes
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve, prepare-release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: [self-hosted, nix, x86_64-linux]
          - target: aarch64-linux
            runner: [self-hosted, linux, aarch64]
          - target: aarch64-darwin
            runner: [self-hosted, macos, aarch64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive

      - name: Verify native target and Nix dev shell
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual="$(./scripts/release-lib.sh target)"
          [[ "$actual" == "$TARGET" ]]
          nix develop --command cargo --version

      - name: Build raw portable Tendril binary with Cargo
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rm -rf target/release
          nix develop --command cargo build --release --locked -p tendril --bin tendril

          if [[ "$TARGET" == *-darwin ]]; then
            bin="target/release/tendril"
            while IFS= read -r ref; do
              [[ -n "$ref" ]] && install_name_tool -change "$ref" /usr/lib/libiconv.2.dylib "$bin"
            done < <(otool -L "$bin" | grep -oE '/nix/store/[^ ]*libiconv[^ ]*\.dylib' || true)
            remaining="$(otool -L "$bin" | grep /nix/store || true)"
            if [[ -n "$remaining" ]]; then
              echo "::error::Darwin release binary still references the Nix store:" >&2
              echo "$remaining" >&2
              exit 1
            fi
            otool -L "$bin"
          fi

      - name: Package updatable-cli TendrilStyle assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          target="${{ matrix.target }}"
          root="tendril-$version-$target"
          rm -rf dist "$root"
          mkdir -p dist "$root"
          cp target/release/tendril "$root/tendril"
          chmod +x "$root/tendril"
          tar -czf "dist/$root.tar.gz" "$root"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$root.tar.gz" | awk '{print $1}' > "dist/$root.sha256"
          else
            shasum -a 256 "dist/$root.tar.gz" | awk '{print $1}' > "dist/$root.sha256"
          fi

      - name: Smoke exact packaged binary and updater wiring
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          target="${{ matrix.target }}"
          root="tendril-$version-$target"
          rm -rf smoke
          mkdir -p smoke
          tar -xzf "dist/$root.tar.gz" -C smoke
          "smoke/$root/tendril" version | grep -Fx "tendril $version"
          "smoke/$root/tendril" --version | grep -F "$version"
          "smoke/$root/tendril" update status

      - name: Upload target assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.resolve.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            dist/* \
            --clobber

  publish:
    name: Publish release
    needs: [resolve, build]
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 15
    steps:
      - name: Verify complete updatable-cli asset set and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          version="${{ needs.resolve.outputs.version }}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for target in x86_64-linux aarch64-linux aarch64-darwin; do
            grep -Fxq "tendril-$version-$target.tar.gz" <<<"$assets"
            grep -Fxq "tendril-$version-$target.sha256" <<<"$assets"
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
