name: pages

# Shared self-hosted gh-pages publisher (harryaskham.github.io publish-pages.yml):
# site/ + workspace rustdoc → a.skh.am/tendril/. Site changes on main
# deploy immediately; release tags refresh the API docs.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - site/**
      - scripts/site/**
      - scripts/check-site.py
      - scripts/build-docs.sh
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: write # push gh-pages
  pages: write    # request the Pages build

jobs:
  pages:
    uses: harryaskham/harryaskham.github.io/.github/workflows/publish-pages.yml@main
    with:
      path: target/site
      submodules: recursive
      timeout-minutes: 60
      build: nix develop --command ./scripts/build-docs.sh
