<!doctype html>
<html><head><meta charset="utf-8"><title>Tendril Persistence Waiting</title>
<style>
body{font-family:sans-serif;margin:44px 60px;background:#f8fafc;color:#0f172a}h1{font-size:42px;margin:0 0 16px}p{font-size:23px}.panel{margin-top:28px;border:5px solid #334155;background:white;border-radius:16px;padding:28px;width:900px;font-size:25px}.row{margin:18px 0}.row label{display:block;margin-bottom:8px;font-weight:700}.row input,.row textarea{width:780px;font-size:25px;border:3px solid #64748b;border-radius:8px;padding:10px}.row textarea{height:95px}button{font-size:26px;padding:13px 24px;border-radius:8px}.summary{margin-top:26px;border:4px solid #334155;padding:18px;width:920px;font-size:25px;background:white;white-space:pre-wrap}.ok{border-color:#047857;background:#ecfdf5;color:#047857;font-weight:700}</style></head>
<body>
<h1>Tendril local-storage reload task</h1>
<p>Fill a Unicode draft, save to localStorage, reload the page, and verify the restored state.</p>
<div class="panel">
  <div class="row"><label for="title">Title</label><input id="title" autocomplete="off"></div>
  <div class="row"><label for="note">Note</label><textarea id="note"></textarea></div>
  <button id="save">Save draft</button> <button id="verify">Verify restored draft</button>
</div>
<div id="summary" class="summary">waiting</div>
<script>
const expectedTitle='Café persisted ✓';
const expectedNote='Reload kept π 😀 state';
const title=document.getElementById('title'), note=document.getElementById('note'), summary=document.getElementById('summary');
function applyLoaded(){const raw=localStorage.getItem('tendril-persistence-draft'); if(!raw){document.title='Tendril Persistence Waiting'; return;} try{const d=JSON.parse(raw); title.value=d.title||''; note.value=d.note||''; summary.textContent='loaded draft: '+title.value+' / '+note.value; document.title=(title.value===expectedTitle && note.value===expectedNote)?'Tendril Persistence Reloaded':'Tendril Persistence Loaded';}catch(e){summary.textContent='load error '+e;}}
document.getElementById('save').addEventListener('click',()=>{localStorage.setItem('tendril-persistence-draft',JSON.stringify({title:title.value,note:note.value})); summary.textContent='saved draft: '+title.value+' / '+note.value; summary.className='summary ok'; document.title='Tendril Persistence Saved';});
document.getElementById('verify').addEventListener('click',()=>{const ok=title.value===expectedTitle && note.value===expectedNote; summary.textContent=ok?'persistence-browser-ok: '+title.value+' / '+note.value:'persistence mismatch: '+title.value+' / '+note.value; summary.className=ok?'summary ok':'summary'; document.title=ok?'Tendril Persistence Submitted':'Tendril Persistence Mismatch';});
applyLoaded();
</script>
</body></html>
