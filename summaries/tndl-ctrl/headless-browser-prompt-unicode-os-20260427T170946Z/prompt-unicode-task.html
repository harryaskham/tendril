<!doctype html><html><head><meta charset="utf-8"><title>Tendril Unicode Prompt Waiting</title>
<style>body{font-family:sans-serif;margin:48px;font-size:24px}button{font-size:30px;padding:20px 32px;margin-top:40px}#status{margin-top:28px;border:3px solid #333;padding:16px;min-height:40px;white-space:pre-wrap}</style></head><body><h1>Tendril Unicode prompt task</h1><p>Open a browser prompt, enter the exact Unicode response, and accept.</p><button id="prompt" onclick="const expected='Prompt 😀 Café π — ✓'; const got=prompt('Enter Unicode prompt proof:', ''); document.body.dataset.got=got || ''; if(got===expected){document.title='Tendril Unicode Prompt Accepted'; document.getElementById('status').textContent='unicode-prompt-browser-ok';}else{document.title='Tendril Unicode Prompt Mismatch'; document.getElementById('status').textContent='unicode prompt mismatch got='+JSON.stringify(got);}">Open Unicode prompt</button><div id="status">waiting</div></body></html>
