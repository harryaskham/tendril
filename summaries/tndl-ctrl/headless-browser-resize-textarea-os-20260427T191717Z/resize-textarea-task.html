<!doctype html><html><head><meta charset="utf-8"><title>Tendril Resize Waiting</title><style>body{font-family:sans-serif;margin:48px;font-size:24px}textarea{font-size:22px;width:520px;height:130px;padding:12px;resize:both;overflow:auto;border:4px solid #3459c7}button{font-size:28px;padding:16px 28px;margin-top:28px}#status{margin-top:24px;border:3px solid #333;padding:16px;min-height:40px}</style></head><body><h1>Tendril textarea resize task</h1><p>Drag the textarea resize handle larger, then verify.</p><textarea id="box">Resize me by dragging the lower-right handle.</textarea><br><button id="verify" onclick="const b=document.getElementById('box').getBoundingClientRect(); if(b.width>=650 && b.height>=210){document.title='Tendril Resize Submitted'; document.getElementById('status').textContent='resize-browser-ok width='+Math.round(b.width)+' height='+Math.round(b.height);}else{document.title='Tendril Resize Mismatch'; document.getElementById('status').textContent='resize mismatch width='+Math.round(b.width)+' height='+Math.round(b.height);}">Verify resize</button><div id="status">waiting</div></body></html>
