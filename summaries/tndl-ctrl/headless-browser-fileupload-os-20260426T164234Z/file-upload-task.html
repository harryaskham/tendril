<!doctype html>
<html><head><meta charset="utf-8"><title>Tendril File Upload Task</title><style>
body{font-family:system-ui,sans-serif;margin:0;padding:42px;background:#fffaf3;color:#17202a}h1{font-size:42px;margin:0 0 22px}.panel{border:4px solid #2b78d4;border-radius:18px;padding:28px;width:900px;background:#eef6ff}input{font-size:24px;margin:18px 0}.result{margin-top:28px;padding:24px;background:#0b5138;color:white;border-left:12px solid #35e39b;min-height:90px;font-size:30px;font-weight:900;white-space:pre-wrap}</style></head>
<body><h1>Tendril File Upload Task</h1><div class="panel"><p>Use Tendril to select a local file via the browser file picker.</p><input id="file" type="file"><div id="result" class="result">Waiting for uploaded file</div></div><script>
const input=document.getElementById('file');const result=document.getElementById('result');input.addEventListener('change', async () => { const f=input.files && input.files[0]; if(!f){result.textContent='No file selected'; return;} const text=await f.text(); result.textContent='Uploaded file confirmed: '+f.name+'\n'+text; document.title='Tendril File Upload Confirmed'; });
</script></body></html>
