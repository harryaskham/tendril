<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tendril Popup Parent Waiting</title>
  <style>
    body { font-family: sans-serif; margin: 36px 50px; }
    h1 { font-size: 44px; margin: 0 0 20px; }
    p { font-size: 22px; }
    button { font-size: 28px; padding: 16px 28px; }
    #status { margin-top: 24px; border: 3px solid #333; padding: 14px; font-size: 24px; white-space: pre-wrap; }
    .ok { color: #047857; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Tendril popup form task</h1>
  <p>Open a popup window, fill its form, submit, and verify the parent receives the result.</p>
  <button id="open-popup" type="button">Open popup task</button>
  <div id="status">waiting</div>
  <script>
    const expected = 'popup control verified';
    const status = document.getElementById('status');
    document.getElementById('open-popup').addEventListener('click', () => {
      const popup = window.open('', 'tendrilPopupTask', 'width=760,height=520,left=220,top=160');
      popup.document.open();
      popup.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Tendril Popup Waiting</title><style>body{font-family:sans-serif;margin:36px 46px;}h1{font-size:34px;}label,input,button{font-size:24px;}input{display:block;width:560px;padding:10px;margin-top:10px;}button{display:block;margin-top:22px;padding:12px 24px;}#status{margin-top:20px;border:2px solid #333;padding:12px;}</style></head><body><h1>Tendril popup child task</h1><label for="popup-input">Popup task input</label><input id="popup-input" autofocus><button id="submit" type="button">Submit popup value</button><div id="status">waiting</div><script>const expected='popup control verified';document.getElementById('submit').addEventListener('click',()=>{const value=document.getElementById('popup-input').value;document.body.dataset.popupValue=value;if(value===expected){document.title='Tendril Popup Submitted';document.getElementById('status').textContent='popup-browser-ok';window.opener.postMessage({kind:'popup-submit', value}, '*');}else{document.title='Tendril Popup Mismatch';document.getElementById('status').textContent='popup mismatch value='+JSON.stringify(value);}});<\/script></body></html>`);
      popup.document.close();
      popup.focus();
    });
    window.addEventListener('message', event => {
      if (!event.data || event.data.kind !== 'popup-submit') return;
      document.body.dataset.popupValue = event.data.value;
      if (event.data.value === expected) {
        document.title = 'Tendril Popup Parent Submitted';
        status.textContent = 'popup-parent-browser-ok';
        status.className = 'ok';
      } else {
        document.title = 'Tendril Popup Parent Mismatch';
        status.textContent = 'popup parent mismatch value=' + JSON.stringify(event.data.value);
        status.className = '';
      }
    });
  </script>
</body>
</html>
