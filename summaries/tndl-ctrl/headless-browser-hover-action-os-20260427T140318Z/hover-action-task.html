<!doctype html><html><head><meta charset="utf-8"><title>Tendril Hover Action Waiting</title>
<style>body{font-family:sans-serif;margin:48px;font-size:24px}.menu{margin-top:80px;width:700px;height:120px;padding:24px;border:4px solid #333;background:#eef;position:relative}.menu:hover{background:#ddf}.menu button{display:none;position:absolute;left:360px;top:24px;font-size:26px;padding:18px 28px}.menu:hover button{display:block}#status{margin-top:28px;padding:18px;border:3px solid #333;min-height:40px}</style></head><body><h1>Tendril hover-contained action task</h1><p>Hover the large menu, then click the revealed button while still inside the hovered element.</p><div id="menu" class="menu" onmouseenter="document.body.dataset.hovered='true'; document.getElementById('status').textContent='hovered-no-click';">Hover target menu<button id="action" onclick="document.title='Tendril Hover Action Clicked'; document.body.dataset.clicked='true'; document.getElementById('status').textContent='hover-action-browser-ok';">Hidden action</button></div><div id="status">waiting</div></body></html>
