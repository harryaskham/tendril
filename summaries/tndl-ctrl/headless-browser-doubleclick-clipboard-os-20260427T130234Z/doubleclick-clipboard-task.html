<!doctype html>
<html><head><meta charset="utf-8" /><title>Tendril Double Click Clipboard Waiting</title>
<style>body{font-family:sans-serif;margin:48px;font-size:24px}.copyline{margin-top:40px;padding:24px;border:4px solid #333;font-size:42px;user-select:text;width:1100px}.marker{color:#036;font-weight:bold}#result{margin-top:24px;padding:16px;border:3px solid #333;min-height:48px}</style>
</head><body>
<h1>Tendril double-click word clipboard task</h1>
<p id="status">Waiting for Tendril double-click word copy.</p>
<div id="copyline" class="copyline">prefix <span id="target" class="marker">doublewordclipboard</span> suffix</div>
<div id="result">No copy event yet.</div>
<script>
document.addEventListener('copy', () => {
  const selection = String(window.getSelection());
  if (selection.includes('doublewordclipboard')) {
    document.title = 'Tendril Double Click Clipboard Copied';
    document.getElementById('status').textContent = 'double-click-clipboard-browser-ok';
  } else {
    document.title = 'Tendril Double Click Clipboard Mismatch';
    document.getElementById('status').textContent = 'double-click-clipboard-browser-mismatch';
  }
  document.getElementById('result').textContent = `copied selection=${selection}`;
});
</script>
</body></html>
