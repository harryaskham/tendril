<!doctype html>
<html><head><meta charset="utf-8"><title>Tendril XTerm Primary Waiting</title>
<style>
body{font-family:sans-serif;margin:44px 60px;background:#f8fafc;color:#0f172a}h1{font-size:42px;margin:0 0 16px}p{font-size:23px}.panel{margin-top:28px;border:5px solid #334155;background:white;border-radius:16px;padding:28px;width:900px;font-size:25px}.row{margin:18px 0}.row label{display:block;margin-bottom:8px;font-weight:700}.row input{width:780px;font-size:28px;border:3px solid #64748b;border-radius:8px;padding:12px}button{font-size:26px;padding:13px 24px;border-radius:8px}.summary{margin-top:26px;border:4px solid #334155;padding:18px;width:920px;font-size:25px;background:white;white-space:pre-wrap}.ok{border-color:#047857;background:#ecfdf5;color:#047857;font-weight:700}</style></head>
<body>
<h1>Tendril XTerm PRIMARY to browser task</h1>
<p>Select text in XTerm, middle-click paste it into the browser input, then verify the in-browser result.</p>
<div class="panel"><div class="row"><label for="value">Paste XTerm PRIMARY selection here</label><input id="value" autocomplete="off"></div><button id="verify">Verify pasted value</button></div>
<div id="summary" class="summary">waiting</div>
<script>
const expected='xterm-primary-ok';
document.getElementById('verify').addEventListener('click',()=>{const value=document.getElementById('value').value; const ok=value===expected; const s=document.getElementById('summary'); s.textContent=ok?'xterm-primary-browser-ok: '+value:'xterm-primary mismatch: '+value; s.className=ok?'summary ok':'summary'; document.title=ok?'Tendril XTerm Primary Submitted':'Tendril XTerm Primary Mismatch';});
</script>
</body></html>
