<!doctype html>
<html><head><meta charset="utf-8" /><title>Tendril Keyboard Access Waiting</title>
<style>body{font-family:sans-serif;margin:48px;font-size:22px}label{display:block;margin:18px 0 6px}input,textarea,button{font-size:22px;padding:8px;width:760px}textarea{height:110px}.checkline input{width:auto;transform:scale(1.6);margin-right:16px}#result{margin-top:24px;padding:16px;border:3px solid #444;min-height:48px}</style>
</head><body><h1>Tendril keyboard access task</h1><p id="status">Waiting for Tendril keyboard-only form completion.</p><form id="taskForm"><label for="agentName">Agent name</label><input id="agentName" name="agentName" autofocus placeholder="type agent name" /><label for="notes">Notes</label><textarea id="notes" name="notes" placeholder="type notes"></textarea><label class="checkline"><input id="confirmBox" name="confirmBox" type="checkbox" /> keyboard checkbox proof</label><button id="submit" type="submit">Submit keyboard task</button></form><div id="result">No result yet.</div><script>document.getElementById('taskForm').addEventListener('submit',event=>{event.preventDefault();const name=document.getElementById('agentName').value;const notes=document.getElementById('notes').value;const checked=document.getElementById('confirmBox').checked;const ok=name.includes('keyboard-agent')&&notes.includes('tab-driven-notes')&&checked;document.title=ok?'Tendril Keyboard Access Submitted':'Tendril Keyboard Access Mismatch';document.getElementById('status').textContent=ok?'keyboard-access-browser-ok':'keyboard-access-browser-mismatch';document.getElementById('result').textContent=`name=${name}; notes=${notes}; checked=${checked}`;});</script></body></html>
