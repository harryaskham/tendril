<!doctype html><meta charset="utf-8"><title>Tendril Clipboard Task</title>
<style>body{font-family:sans-serif;font-size:26px;margin:40px} textarea{font-size:30px;width:1000px;height:130px;margin-top:30px} #status{margin-top:30px;color:#064;font-weight:bold}</style>
<h1>Tendril Clipboard Task</h1>
<p>Agent should copy the textarea proof through browser UI, then paste it into the OS terminal.</p>
<textarea id="proof" onfocus="this.select()">browser-to-os-clipboard-control-ok</textarea>
<div id="status">Waiting for Tendril copy.</div>
<script>
const proof=document.getElementById('proof');
proof.addEventListener('copy',()=>{document.getElementById('status').textContent='Copy event observed for proof text.'; document.body.dataset.copyObserved='true';});
</script>
