<!doctype html><html><head><meta charset="utf-8"><title>Tendril ShiftClick Waiting</title><style>body{font-family:sans-serif;margin:48px;font-size:24px}.item{width:520px;padding:14px 22px;margin:8px 0;border:4px solid #333;border-radius:10px;background:#f7f7f7;user-select:none}.item.selected{background:#bfdbfe;border-color:#1d4ed8}#status{margin-top:24px;border:3px solid #333;padding:16px;min-height:40px}</style></head><body><h1>Tendril Shift-click range task</h1><p>Click Alpha, then hold Shift and click Delta.</p><div id="alpha" class="item" data-name="alpha">Alpha row</div><div id="beta" class="item" data-name="beta">Beta row</div><div id="gamma" class="item" data-name="gamma">Gamma row</div><div id="delta" class="item" data-name="delta">Delta row</div><div id="epsilon" class="item" data-name="epsilon">Epsilon row</div><div id="status">waiting</div><script>const items=[...document.querySelectorAll('.item')]; let anchor=null; let shiftClicks=0; function setSelectedRange(a,b){const lo=Math.min(a,b),hi=Math.max(a,b);items.forEach((it,i)=>it.classList.toggle('selected',i>=lo&&i<=hi));} function check(){const selected=items.filter(e=>e.classList.contains('selected')).map(e=>e.dataset.name).join(',');document.getElementById('status').textContent='selected='+selected+' shiftClicks='+(document.body.dataset.shiftClicks||'0');if(selected==='alpha,beta,gamma,delta'&&document.body.dataset.shiftClicks==='1'){document.title='Tendril ShiftClick Submitted';}} items.forEach((item,index)=>item.addEventListener('click',e=>{if(e.shiftKey&&anchor!==null){shiftClicks+=1;document.body.dataset.shiftClicks=String(shiftClicks);setSelectedRange(anchor,index);}else{anchor=index;items.forEach((it,i)=>it.classList.toggle('selected',i===index));}check();}));</script></body></html>
