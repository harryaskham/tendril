<!doctype html><html><head><meta charset="utf-8"><title>Tendril Emoji Text Waiting</title>
<style>body{font-family:sans-serif;margin:48px;font-size:24px}textarea{font-size:28px;width:1200px;height:170px;padding:12px}button{font-size:28px;padding:16px 28px;margin-top:18px}#status{margin-top:24px;border:3px solid #333;padding:16px;min-height:40px}</style></head><body>
<h1>Tendril emoji browser text task</h1>
<p>Type the exact proof text including an actual emoji, accented letters, and symbols.</p>
<textarea id="proof" autofocus></textarea><br>
<button id="submit" onclick="const expected='Emoji 😀 Café π — ✓'; const got=document.getElementById('proof').value; document.body.dataset.got=got; if(got===expected){document.title='Tendril Emoji Text Submitted'; document.getElementById('status').textContent='emoji-browser-ok';}else{document.title='Tendril Emoji Text Mismatch'; document.getElementById('status').textContent='emoji mismatch got='+got;}">Submit emoji proof</button>
<div id="status">waiting</div>
</body></html>
