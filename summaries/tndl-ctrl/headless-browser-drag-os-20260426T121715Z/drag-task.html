<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tendril Drag Task</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 36px; background: #f8fbff; color: #102030; }
    h1 { font-size: 42px; margin: 0 0 20px; }
    #pad { position: absolute; left: 80px; top: 160px; width: 900px; height: 260px; border: 5px solid #0b78d0; border-radius: 18px; background: #e7f4ff; touch-action: none; }
    #dot { position: absolute; left: 70px; top: 95px; width: 62px; height: 62px; border-radius: 50%; background: #d04a02; box-shadow: 0 3px 14px #3337; }
    #result { position: absolute; left: 80px; top: 470px; width: 1100px; min-height: 58px; padding: 20px; color: white; background: #083b2b; border-left: 12px solid #17d979; font-size: 30px; font-weight: 900; }
  </style>
</head>
<body>
  <h1>Tendril Browser Drag Task</h1>
  <p>Agent should drag the orange marker across the blue pad.</p>
  <div id="pad"><div id="dot"></div></div>
  <div id="result">Waiting for Tendril drag automation</div>
  <script>
    const pad = document.getElementById('pad');
    const dot = document.getElementById('dot');
    const result = document.getElementById('result');
    let dragging = false;
    pad.addEventListener('pointerdown', event => {
      dragging = true;
      pad.setPointerCapture(event.pointerId);
      result.textContent = 'Drag started by Tendril';
    });
    pad.addEventListener('pointermove', event => {
      if (!dragging) return;
      const rect = pad.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width - 62, event.clientX - rect.left - 31));
      const y = Math.max(0, Math.min(rect.height - 62, event.clientY - rect.top - 31));
      dot.style.left = x + 'px';
      dot.style.top = y + 'px';
    });
    pad.addEventListener('pointerup', event => {
      dragging = false;
      const rect = pad.getBoundingClientRect();
      result.textContent = 'Dragged by Tendril to ' + Math.round(event.clientX - rect.left) + ', ' + Math.round(event.clientY - rect.top);
    });
  </script>
</body>
</html>
