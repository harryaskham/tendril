<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tendril Grid Waiting</title>
<style>
body{font-family:sans-serif;margin:36px 50px}h1{font-size:44px;margin:0 0 20px}p{font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,210px);gap:8px;width:max-content;border:5px solid #555;border-radius:10px;padding:18px;background:#fafafa}input{font-size:26px;padding:12px;width:180px;border:3px solid #333;border-radius:6px}.label{font-size:18px;color:#333;margin-bottom:4px}button{font-size:28px;padding:16px 28px;margin-top:22px}#status{margin-top:24px;border:3px solid #333;padding:14px;font-size:24px;white-space:pre-wrap}.ok{color:#047857;font-weight:700}</style></head>
<body>
<h1>Tendril spreadsheet grid task</h1><p>Fill cells using keyboard navigation: type Alpha, Tab to Beta, Down to Gamma, submit.</p>
<div class="grid">
  <div><div class="label">A1</div><input id="a1" data-row="1" data-col="1"></div>
  <div><div class="label">B1</div><input id="b1" data-row="1" data-col="2"></div>
  <div><div class="label">C1</div><input id="c1" data-row="1" data-col="3"></div>
  <div><div class="label">A2</div><input id="a2" data-row="2" data-col="1"></div>
  <div><div class="label">B2</div><input id="b2" data-row="2" data-col="2"></div>
  <div><div class="label">C2</div><input id="c2" data-row="2" data-col="3"></div>
</div>
<button id="verify" type="button">Verify grid</button><div id="status">waiting</div>
<script>
document.querySelectorAll('input').forEach(input=>input.addEventListener('keydown', e=>{const row=Number(input.dataset.row), col=Number(input.dataset.col);let next=null;if(e.key==='ArrowDown')next=document.querySelector(`[data-row="${row+1}"][data-col="${col}"]`);if(e.key==='ArrowUp')next=document.querySelector(`[data-row="${row-1}"][data-col="${col}"]`);if(e.key==='ArrowLeft' && input.selectionStart===0)next=document.querySelector(`[data-row="${row}"][data-col="${col-1}"]`);if(e.key==='ArrowRight' && input.selectionStart===input.value.length)next=document.querySelector(`[data-row="${row}"][data-col="${col+1}"]`);if(next){e.preventDefault();next.focus();next.select();}}));
document.getElementById('verify').addEventListener('click',()=>{const a=document.getElementById('a1').value,b=document.getElementById('b1').value,g=document.getElementById('b2').value;document.body.dataset.gridValues=[a,b,g].join('|');const status=document.getElementById('status');if(a==='Alpha'&&b==='Beta'&&g==='Gamma'){document.title='Tendril Grid Submitted';status.textContent='grid-browser-ok values='+document.body.dataset.gridValues;status.className='ok';}else{document.title='Tendril Grid Mismatch';status.textContent='grid mismatch values='+document.body.dataset.gridValues;}});
</script>
</body></html>
