<!doctype html><html><head><meta charset="utf-8"><title>Tendril CtrlClick Waiting</title><style>body{font-family:sans-serif;margin:48px;font-size:24px}.item{width:520px;padding:18px 24px;margin:10px 0;border:4px solid #333;border-radius:10px;background:#f7f7f7;user-select:none}.item.selected{background:#a7f3d0;border-color:#047857}button{font-size:28px;padding:16px 28px;margin-top:24px}#status{margin-top:24px;border:3px solid #333;padding:16px;min-height:40px}</style></head><body><h1>Tendril Control-click multi-select task</h1><p>Hold Control and click Alpha and Gamma, then verify.</p><div id="alpha" class="item" data-name="alpha">Alpha row</div><div id="beta" class="item" data-name="beta">Beta row</div><div id="gamma" class="item" data-name="gamma">Gamma row</div><button id="verify" onclick="const selected=[...document.querySelectorAll('.item.selected')].map(e=>e.dataset.name).join(','); if(selected==='alpha,gamma' && document.body.dataset.ctrlClicks==='2'){document.title='Tendril CtrlClick Submitted'; document.getElementById('status').textContent='ctrlclick-browser-ok '+selected;}else{document.title='Tendril CtrlClick Mismatch'; document.getElementById('status').textContent='ctrlclick mismatch selected='+selected+' ctrlClicks='+(document.body.dataset.ctrlClicks||'0');}">Verify multi-select</button><div id="status">waiting</div><script>let ctrlClicks=0; for (const item of document.querySelectorAll('.item')) { item.addEventListener('click', e => { if (e.ctrlKey || e.metaKey) { ctrlClicks += 1; document.body.dataset.ctrlClicks = String(ctrlClicks); item.classList.toggle('selected'); } else { for (const other of document.querySelectorAll('.item')) other.classList.remove('selected'); item.classList.add('selected'); } }); }</script></body></html>
