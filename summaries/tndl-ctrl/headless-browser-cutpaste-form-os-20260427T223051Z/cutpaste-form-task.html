<!doctype html><html><head><meta charset="utf-8"><title>Tendril CutPaste Waiting</title>
<style>body{font-family:sans-serif;margin:48px;font-size:24px}input,button,label{font-size:28px;margin:12px 0;display:block}input{width:760px;padding:14px}button{padding:16px 28px}#status{margin-top:24px;border:3px solid #333;padding:16px;min-height:40px}</style></head><body>
<h1>Tendril browser cut-paste task</h1><p>Type into source, cut it, paste into destination, then submit.</p>
<form id="form"><label>Source <input id="source" autofocus type="text" placeholder="cut from here"></label><label>Destination <input id="dest" type="text" placeholder="paste here"></label><button id="submit" type="submit">Verify cut-pasted value</button></form>
<div id="status">waiting</div>
<script>
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); const source=document.getElementById('source').value; const dest=document.getElementById('dest').value; if(source==='' && dest==='Cut Paste Agent'){document.title='Tendril CutPaste Submitted'; document.getElementById('status').textContent='cutpaste-browser-ok';}else{document.title='Tendril CutPaste Mismatch'; document.getElementById('status').textContent='source='+JSON.stringify(source)+' dest='+JSON.stringify(dest);} });
</script></body></html>
