<!doctype html><meta charset="utf-8"><title>Tendril Selection Clipboard Waiting</title>
<style>body{font-family:sans-serif;font-size:30px;margin:40px} textarea{font-family:monospace;font-size:30px;width:1100px;height:110px;padding:16px;display:block} #status{color:#064;font-weight:bold;margin-top:25px}.box{border:3px solid #333;background:#f7fbff;padding:25px;width:1250px}</style>
<h1>Tendril Selection Clipboard Task</h1>
<div class="box">
<textarea id="proof">select-drag-clipboard-proof-ok</textarea>
<div id="status">Drag-select the text and copy it.</div>
</div>
<script>
const ta=document.getElementById('proof');
const status=document.getElementById('status');
ta.addEventListener('copy', () => { document.title='Tendril Selection Copied'; status.textContent='selection-copy-event-ok'; });
</script>
