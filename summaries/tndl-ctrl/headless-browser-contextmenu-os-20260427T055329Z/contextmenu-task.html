<!doctype html><meta charset="utf-8"><title>Tendril Context Menu Waiting</title>
<style>body{font-family:sans-serif;font-size:30px;margin:40px} #target{border:4px dashed #333;background:#f7fbff;width:900px;height:360px;padding:30px;margin-top:20px} #status{color:#064;font-weight:bold;margin-top:25px}</style>
<h1>Tendril Context Menu Task</h1>
<p>Right-click inside the dashed target. The page prevents the default menu and records the event.</p>
<div id="target">Right-click target zone</div>
<div id="status">Waiting for context menu event.</div>
<script>
const target=document.getElementById('target');
const status=document.getElementById('status');
target.addEventListener('contextmenu', ev => {
  ev.preventDefault();
  const r=target.getBoundingClientRect();
  const x=Math.round(ev.clientX-r.left), y=Math.round(ev.clientY-r.top);
  document.body.dataset.contextDone='true';
  document.title='Tendril Context Menu Hit';
  status.textContent=`Context menu event confirmed at ${x}, ${y}`;
  target.textContent='context-menu-control-ok';
  target.style.borderColor='#064';
  target.style.background='#e9fff0';
});
</script>
