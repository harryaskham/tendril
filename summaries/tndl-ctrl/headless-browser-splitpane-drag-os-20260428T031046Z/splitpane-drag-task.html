<!doctype html><html><head><meta charset="utf-8"><title>Tendril SplitPane Waiting</title><style>body{font-family:sans-serif;margin:36px 50px}h1{font-size:44px;margin:0 0 20px}p{font-size:22px}#shell{width:980px;height:330px;border:5px solid #555;border-radius:10px;display:flex;user-select:none}#left{width:260px;background:#eef6ff;padding:20px;font-size:24px;box-sizing:border-box}#resizer{width:16px;background:#444;cursor:col-resize;touch-action:none}#right{flex:1;background:#fff;padding:20px;font-size:24px}#status{margin-top:24px;border:3px solid #333;padding:14px;font-size:24px;white-space:pre-wrap}.ok{color:#047857;font-weight:700}</style></head><body><h1>Tendril split-pane drag task</h1><p>Drag the vertical divider right to widen the left pane.</p><div id="shell"><div id="left">Left pane<br><span id="width-readout">width: 260</span></div><div id="resizer" role="separator" aria-orientation="vertical" tabindex="0"></div><div id="right">Right pane should shrink after the drag.</div></div><div id="status">waiting</div><script>const left=document.getElementById('left'),resizer=document.getElementById('resizer'),readout=document.getElementById('width-readout'),status=document.getElementById('status');let dragging=false;function setWidth(x){const shellLeft=document.getElementById('shell').getBoundingClientRect().left;const width=Math.max(180,Math.min(700,Math.round(x-shellLeft)));left.style.width=width+'px';readout.textContent='width: '+width;document.body.dataset.leftWidth=String(width);if(width>=470){document.title='Tendril SplitPane Submitted';status.textContent='splitpane-browser-ok width='+width;status.className='ok';}}resizer.addEventListener('pointerdown',e=>{dragging=true;resizer.setPointerCapture(e.pointerId);e.preventDefault();});resizer.addEventListener('pointermove',e=>{if(dragging)setWidth(e.clientX);});resizer.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;setWidth(e.clientX);});</script></body></html>
