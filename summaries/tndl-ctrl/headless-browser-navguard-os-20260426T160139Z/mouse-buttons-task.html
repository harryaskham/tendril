<!doctype html>
<html><head><meta charset="utf-8"><title>Tendril Mouse Buttons Task</title><style>
body{font-family:system-ui,sans-serif;margin:0;padding:36px;background:#f8fbff;color:#102030}h1{font-size:42px;margin:0 0 20px}#pad{position:absolute;left:70px;top:150px;width:1000px;height:300px;border-radius:18px;background:linear-gradient(90deg,#1168d8,#8050d8,#c43b3b);color:white;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:space-around;user-select:none}#result{position:absolute;left:70px;top:500px;width:1120px;min-height:80px;padding:20px;background:#083b2b;color:white;border-left:12px solid #19d978;font-size:30px;font-weight:900}</style></head>
<body><h1>Tendril Mouse Buttons Task</h1><p>Agent should left, middle, and right click the large browser pad.</p><div id="pad"><span>Left</span><span>Middle</span><span>Right</span></div><div id="result">Waiting for mouse-button automation</div><script>
const state={left:false,middle:false,right:false};const result=document.getElementById('result');function render(){const done=state.left&&state.middle&&state.right;result.textContent=(done?'All mouse buttons confirmed: ':'Mouse button progress: ')+'left='+state.left+', middle='+state.middle+', right='+state.right;}document.addEventListener('contextmenu',e=>e.preventDefault(),true);document.addEventListener('mousedown',e=>{if(e.button===0)state.left=true;if(e.button===1)state.middle=true;if(e.button===2)state.right=true;e.preventDefault();render();},true);document.addEventListener('auxclick',e=>e.preventDefault(),true);
</script></body></html>
