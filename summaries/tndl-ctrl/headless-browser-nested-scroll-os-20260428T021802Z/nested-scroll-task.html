<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tendril Nested Scroll Waiting</title>
  <style>
    body { font-family: sans-serif; margin: 36px 50px; }
    h1 { font-size: 44px; margin: 0 0 20px; }
    p { font-size: 22px; }
    #panel { width: 880px; height: 260px; overflow: auto; border: 5px solid #555; border-radius: 10px; padding: 24px 32px; font-size: 24px; }
    .spacer { height: 620px; background: linear-gradient(#fff, #eef); padding-top: 20px; }
    button { font-size: 28px; padding: 16px 28px; }
    #status { margin-top: 24px; border: 3px solid #333; padding: 14px; font-size: 24px; white-space: pre-wrap; }
    .ok { color: #047857; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Tendril nested scroll task</h1>
  <p>Scroll inside the panel, reveal the action button, and click it.</p>
  <div id="panel">
    <div>Top of scrollable panel. The target button is below this internal panel, not on the page body.</div>
    <div class="spacer">Keep scrolling inside this panel.</div>
    <button id="hidden-action" type="button">Submit nested scroll action</button>
  </div>
  <div id="status">waiting</div>
  <script>
    document.getElementById('hidden-action').addEventListener('click', () => {
      document.title = 'Tendril Nested Scroll Submitted';
      const status = document.getElementById('status');
      status.textContent = 'nested-scroll-browser-ok';
      status.className = 'ok';
      document.body.dataset.nestedScroll = 'ok';
    });
  </script>
</body>
</html>
