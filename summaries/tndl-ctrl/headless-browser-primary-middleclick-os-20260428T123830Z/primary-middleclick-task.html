<!doctype html>
<html><head><meta charset="utf-8"><title>Tendril Primary Waiting</title>
<style>
body{font-family:sans-serif;margin:44px 60px;background:#f8fafc;color:#0f172a}h1{font-size:42px;margin:0 0 16px}p{font-size:23px}.cmd{margin-top:30px;border:5px solid #334155;background:white;border-radius:16px;padding:28px;width:760px;font:32px monospace;user-select:text;white-space:pre}.summary{margin-top:28px;border:4px solid #334155;padding:18px;width:980px;font-size:25px;background:white}.ok{border-color:#047857;background:#ecfdf5;color:#047857;font-weight:700}</style></head>
<body>
<h1>Tendril browser primary-selection to terminal task</h1>
<p>Drag-select the short shell command, middle-click paste it into XTerm, press Enter, then verify the created OS file.</p>
<div id="command" class="cmd">echo ok>/tmp/p123830</div>
<div id="summary" class="summary">waiting for browser-selected PRIMARY paste into XTerm</div>
<script>document.getElementById('command').addEventListener('mouseup',()=>{const s=String(getSelection()); if(s.includes('/tmp/p')){document.title='Tendril Primary Selected'; document.getElementById('summary').textContent='primary text selected in browser: '+s; document.getElementById('summary').className='summary ok';}});</script>
</body></html>
