<!doctype html>
<html><head><meta charset="utf-8"><title>Tendril Tablist Waiting</title>
<style>
body{font-family:sans-serif;margin:44px 60px;background:#f8fafc;color:#0f172a}h1{font-size:42px;margin:0 0 16px}p{font-size:23px}.panel{margin-top:28px;border:5px solid #334155;background:white;border-radius:16px;padding:28px;width:980px;font-size:25px}.tabs{display:flex;gap:10px;margin-bottom:22px}.tab{font-size:26px;padding:14px 24px;border:3px solid #64748b;border-radius:10px;background:#f1f5f9}.tab[aria-selected=true]{background:#2563eb;color:white;border-color:#1d4ed8}.tab:focus{outline:5px solid #f59e0b}.pane{border:3px solid #334155;border-radius:10px;padding:22px;font-size:27px;min-height:90px}.summary{margin-top:26px;border:4px solid #334155;padding:18px;width:980px;font-size:25px;background:white;white-space:pre-wrap}.ok{border-color:#047857;background:#ecfdf5;color:#047857;font-weight:700}</style></head>
<body>
<h1>Tendril keyboard tablist task</h1>
<p>Use arrow keys to move through a browser tablist, activate the Unicode tab, and verify the selection.</p>
<div class="panel">
  <div class="tabs" role="tablist" aria-label="Care tabs">
    <button id="tab-summary" class="tab" role="tab" aria-selected="true" tabindex="0" data-pane="Summary: vitals ready">Summary</button>
    <button id="tab-notes" class="tab" role="tab" aria-selected="false" tabindex="-1" data-pane="Notes: routine follow-up">Notes</button>
    <button id="tab-unicode" class="tab" role="tab" aria-selected="false" tabindex="-1" data-pane="Unicode care plan: café π ✓ 😀">Unicode plan ✓</button>
  </div>
  <div id="pane" class="pane" role="tabpanel">Summary: vitals ready</div>
</div>
<div id="summary" class="summary">waiting</div>
<script>
const tabs=[...document.querySelectorAll('[role=tab]')];
const pane=document.getElementById('pane'), summary=document.getElementById('summary');
function focusTab(i){tabs.forEach((t,n)=>{t.tabIndex=n===i?0:-1}); tabs[i].focus();}
function selectTab(i){tabs.forEach((t,n)=>t.setAttribute('aria-selected', String(n===i))); pane.textContent=tabs[i].dataset.pane; if(tabs[i].id==='tab-unicode'){summary.textContent='tablist-browser-ok: '+tabs[i].dataset.pane; summary.className='summary ok'; document.title='Tendril Tablist Submitted';}}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>selectTab(i)); tab.addEventListener('keydown',e=>{let j=i; if(e.key==='ArrowRight') j=(i+1)%tabs.length; else if(e.key==='ArrowLeft') j=(i+tabs.length-1)%tabs.length; else if(e.key==='Home') j=0; else if(e.key==='End') j=tabs.length-1; else if(e.key==='Enter'||e.key===' ') {e.preventDefault(); selectTab(i); return;} if(j!==i){e.preventDefault(); focusTab(j);}});});
</script>
</body></html>
