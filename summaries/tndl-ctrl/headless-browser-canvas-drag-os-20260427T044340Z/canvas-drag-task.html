<!doctype html><meta charset="utf-8"><title>Tendril Canvas Drag Task</title>
<style>body{font-family:sans-serif;font-size:30px;margin:40px} canvas{border:4px solid #333;background:#f7fbff;display:block;margin-top:20px} #status{color:#064;font-weight:bold;margin-top:25px}</style>
<h1>Tendril Canvas Drag Task</h1>
<p>Drag inside the canvas from left to right. The page records the release point.</p>
<canvas id="pad" width="900" height="360"></canvas>
<div id="status">Waiting for canvas drag.</div>
<script>
const canvas=document.getElementById('pad');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
let drawing=false;
function pos(ev){ const r=canvas.getBoundingClientRect(); return {x:Math.round(ev.clientX-r.left), y:Math.round(ev.clientY-r.top)}; }
function render(text){ ctx.fillStyle='#f7fbff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#063'; ctx.font='32px sans-serif'; ctx.fillText(text, 30, 80); }
render('Awaiting Tendril drag');
canvas.addEventListener('mousedown', ev => { drawing=true; const p=pos(ev); ctx.strokeStyle='#06c'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(p.x,p.y); status.textContent=`Drag started at ${p.x}, ${p.y}`; });
canvas.addEventListener('mousemove', ev => { if(!drawing) return; const p=pos(ev); ctx.lineTo(p.x,p.y); ctx.stroke(); });
canvas.addEventListener('mouseup', ev => { if(!drawing) return; drawing=false; const p=pos(ev); document.body.dataset.dragDone='true'; document.body.dataset.dragX=String(p.x); document.body.dataset.dragY=String(p.y); status.textContent=`Canvas drag confirmed at ${p.x}, ${p.y}`; });
</script>
