<!doctype html>
<html><head><meta charset="utf-8"><title>Tendril Report Waiting</title>
<style>
body{font-family:sans-serif;margin:40px 56px}h1{font-size:42px;margin:0 0 18px}label{display:block;font-size:24px;font-weight:700;margin-top:18px}input,textarea{font-size:24px;padding:10px;border:3px solid #333;border-radius:8px;width:760px}textarea{height:120px}button{font-size:27px;padding:14px 28px;margin-top:18px}#report{height:135px;margin-top:12px}.ok{border-color:#047857;background:#ecfdf5}#status{font-size:24px;margin-top:12px;padding:12px;border:3px solid #333;width:760px}</style></head>
<body>
<h1>Tendril browser report task</h1>
<p>Fill a report, generate text, copy it, and save it from the OS shell.</p>
<label for="title">Title</label><input id="title" autocomplete="off">
<label for="notes">Notes</label><textarea id="notes"></textarea>
<button id="generate">Generate report</button>
<label for="report">Generated report</label><textarea id="report" readonly></textarea>
<div id="status">waiting</div>
<script>
const expectedTitle='Patient café follow-up';
const expectedNotes='Follow up ✓ π 😀\nActions: check vitals';
const expectedReport=`REPORT: ${expectedTitle}\nNOTES: ${expectedNotes}\nSTATUS: browser-generated ✓`;
document.getElementById('generate').addEventListener('click',()=>{
  const title=document.getElementById('title').value;
  const notes=document.getElementById('notes').value;
  const report=document.getElementById('report');
  report.value=`REPORT: ${title}\nNOTES: ${notes}\nSTATUS: browser-generated ✓`;
  document.body.dataset.report=report.value;
  if(report.value===expectedReport){document.title='Tendril Report Submitted';document.getElementById('status').textContent='report-browser-ok';report.className='ok';}
  else{document.title='Tendril Report Mismatch';document.getElementById('status').textContent='report mismatch '+JSON.stringify(report.value);}
});
</script>
</body></html>
