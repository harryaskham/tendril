<!doctype html>
<html><head><meta charset="utf-8" /><title>Tendril Alert Waiting</title>
<style>body{font-family:sans-serif;margin:48px;font-size:24px}button{font-size:24px;padding:16px 24px}#result{margin-top:24px;padding:16px;border:3px solid #333;min-height:48px}</style>
</head><body><h1>Tendril alert dialog task</h1><p id="status">Waiting for alert acceptance.</p><button id="alertButton">Open alert proof</button><div id="result">No alert accepted yet.</div><script>document.getElementById('alertButton').addEventListener('click',()=>{alert('tendril-alert-proof-ok');document.title='Tendril Alert Accepted';document.getElementById('status').textContent='alert-dialog-browser-ok';document.getElementById('result').textContent='alert accepted after Tendril Return';});</script></body></html>
