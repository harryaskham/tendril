version: 1

projects:
  - name: tendril
    default_branch: main
    beads:
      enabled: true
      branch: beads
    checkout_bootstrap:
      - ./scripts/bootstrap.sh
    test:
      command: nix develop --command cargo test --workspace --all-features
      interception:
        regex:
          - '(^|\\s)cargo\\s+test(\\s|$)'
    build:
      command: nix flake check
      interception:
        regex:
          - '(^|\\s)cargo\\s+build(\\s|$)'
          - '(^|\\s)cargo\\s+clippy(\\s|$)'
          - '(^|\\s)nix\\s+build(\\s|$)'
          - '(^|\\s)nix\\s+flake\\s+check(\\s|$)'
    actions:
      bootstrap:
        type: command
        command: ./scripts/bootstrap.sh
        description: Prepare direnv, hooks, and the workspace shell for a checkout
      build:
        type: command
        command: nix build .#tendril .#mcp-cli
        description: Build the workspace packages exposed by the flake
      test:
        type: command
        command: nix develop --command cargo test --workspace --all-features
        description: Run the Rust workspace test suite inside the dev shell
      lint:
        type: command
        command: nix develop --command cargo clippy --workspace --all-targets --all-features -- -D warnings
        description: Run clippy for the full workspace inside the dev shell
      pre-merge:
        type: command
        command: ./scripts/pre-merge.sh
        description: Fast local pre-merge validation gate for workspace scaffolding
    agent_defaults:
      profile: worker
      type: claude
