name: tendril
remote: "ssh://git@github.com/harryaskham/tendril.git"
default_branch: main
identity: harryaskham
beads:
  enabled: true
  branch: beads
checkout_bootstrap:
  - ./scripts/install-git-hooks.sh
  - direnv allow || true
  - if command -v direnv >/dev/null 2>&1; then eval "$(direnv export bash)"; fi
test:
  command: nix develop --command cargo test --workspace --all-features
  interception:
    regex:
      - '(^|\\s)cargo\\s+test(\\s|$)'
build:
  command: nix flake check
  interception:
    regex:
      - '(^|\\s)cargo\\s+build(\\s|$)'
      - '(^|\\s)cargo\\s+clippy(\\s|$)'
      - '(^|\\s)nix\\s+build(\\s|$)'
      - '(^|\\s)nix\\s+flake\\s+check(\\s|$)'
actions:
  bootstrap:
    type: command
    command: ./scripts/bootstrap.sh
    description: Prepare direnv, git hooks, and the workspace shell for a checkout
    timeout_secs: 120
  build:
    type: command
    command: nix build .#tendril .#mcp-cli
    description: Build the flake packages for the Tendril workspace
    timeout_secs: 1800
  test:
    type: command
    command: nix develop --command cargo test --workspace --all-features
    description: Run the Rust workspace test suite inside the Nix dev shell
    timeout_secs: 1800
  lint:
    type: command
    command: nix develop --command cargo clippy --workspace --all-targets --all-features -- -D warnings
    description: Run clippy for the full workspace inside the Nix dev shell
    timeout_secs: 1800
  release-artifact:
    type: command
    command: ./scripts/stage-release-artifacts.sh
    description: Build and stage the versioned release tarball, checksum, and manifest via Nix
    timeout_secs: 1800
  pre-merge:
    type: command
    command: ./scripts/pre-merge.sh
    description: Run formatting, clippy, tests, and flake checks before merge
    timeout_secs: 2400
agent_defaults:
  profile: worker
  type: pi
  provider: github-copilot
  model: gpt-5.4
  node_selector: local_only
agents:
  persistent:
    tndrl-ctrl:
      profile: project-controller
      type: pi
      auto_start: false
      restart: failure
      nodes:
        - helsinki
